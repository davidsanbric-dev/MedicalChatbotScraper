[project]
name = "medical-conditions-scraper"
version = "0.1.0"
description = "Station 1 of the medical chatbot pipeline: scrape condition pages into PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "psycopg2-binary==2.9.11",
    "requests>=2.31.0",
    "sqlalchemy==2.0.44",
    "urllib3>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
